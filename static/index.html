<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Quizzer</title>
    <link href="/static/styles.css" rel="stylesheet"/>
</head>
<body>
<header class="appbar" role="banner">
    <div class="header-inner">
        <svg aria-hidden="true" class="logo" viewBox="0 0 24 24">
            <defs>
                <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
                    <stop offset="0%" stop-color="#6ea8ff"/>
                    <stop offset="100%" stop-color="#9a8cff"/>
                </linearGradient>
            </defs>
            <path d="M13 2L3 14h7l-1 8 11-12h-7l0-8z" fill="url(#g)"/>
        </svg>
        <div class="title">Quizzer</div>
    </div>
</header>

<main role="main">
    <section aria-labelledby="gen-title" class="card" id="generator">
        <h2 id="gen-title">Create a Quiz</h2>
        <form class="container-row" id="generate-form">
            <label class="form-field">
                <span>Topic</span>
                <input class="input" id="topic" maxlength="120" minlength="2" name="topic"
                       placeholder="e.g., Python basics" required type="text"/>
            </label>
            <label class="form-field">
                <span>Number of questions</span>
                <input class="number" id="num" max="20" min="1" name="num" type="number" value="5"/>
            </label>
            <label class="form-field">
                <span>Difficulty</span>
                <select class="input" id="difficulty" name="difficulty">
                    <option value="easy">Easy</option>
                    <option selected value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </label>
            <label class="form-field">
                <span>Model</span>
                <select class="input" id="modelSelect" name="modelSelect" ">
                <option selected value="gpt-4o-mini">gpt-4o-mini (default)</option>
                <option value="gpt-4o">gpt-4o</option>
                <option value="gpt-5">gpt-5</option>
                </select>
            </label>
            <div class="actions">
                <button class="btn primary" id="generate-btn" type="submit">
                    <span class="btn-label">Generate</span>
                </button>
            </div>
        </form>
        <div aria-live="polite" class="status" id="gen-status"></div>
    </section>

    <section aria-busy="false" aria-labelledby="quiz-title" class="card hidden" id="quiz">
        <h2 id="quiz-title">Quiz</h2>
        <form id="quiz-form"></form>
        <div class="actions">
            <button class="btn primary" id="submit-answers" type="button">
                <span class="btn-label">Submit Answers</span>
            </button>
        </div>
    </section>

    <section aria-labelledby="results-title" class="card hidden" id="results">
        <h2 id="results-title">Results</h2>
        <div id="score"></div>
        <div id="details"></div>
    </section>

    <div aria-live="assertive" class="sr-only" id="toast-root"></div>

    <div class="footer">© 2025 Quizzer</div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
